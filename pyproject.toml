[project]
name = "stt-tts-model-eval"
version = "0.1.0"
description = "Speech-to-Text and Text-to-Speech model evaluation and deployment"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    "shared",
    "stt-inference",
    "tts-inference",
]

[tool.uv.sources]
shared = { workspace = true }
stt-inference = { workspace = true }
tts-inference = { workspace = true }
tts-client = { workspace = true }
stt-eval = { workspace = true }
tts-eval = { workspace = true }
stt-bench = { workspace = true }
tts-bench = { workspace = true }
speech-infra = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/shared",
    "packages/stt-inference",
    "packages/tts-inference",
    "packages/tts-client",
    "packages/stt-eval",
    "packages/tts-eval",
    "packages/stt-bench",
    "packages/tts-bench",
    "packages/speech-infra",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "shared",
    "tts-client",
    "stt-eval",
    "tts-eval",
    "stt-bench",
    "tts-bench",
    "speech-infra",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.isort]
known-first-party = [
    "shared",
    "stt_inference",
    "tts_inference",
    "tts_client",
    "stt_eval",
    "tts_eval",
    "stt_bench",
    "tts_bench",
    "speech_infra",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = ["packages/speech-infra/containers/", "packages/models/"]

[tool.pytest.ini_options]
testpaths = [
    "packages/shared/tests",
    "packages/stt-inference/tests",
    "packages/tts-inference/tests",
    "packages/tts-client/tests",
    "packages/stt-eval/tests",
    "packages/tts-eval/tests",
    "packages/stt-bench/tests",
    "packages/tts-bench/tests",
    "packages/speech-infra/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = ["-v", "--import-mode=importlib"]

[tool.uv]
package = false
