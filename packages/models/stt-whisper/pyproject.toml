[project]
name = "stt-whisper"
version = "0.1.0"
description = "Whisper Large V3 STT inference package (isolated venv)"
requires-python = ">=3.11"
dependencies = [
    "stt-inference",
    "torch>=2.0.0",
    "transformers>=4.46.0",
    "accelerate>=0.26.0",
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
]

[tool.uv.sources]
stt-inference = { path = "../../stt-inference", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_whisper"]
