[project]
name = "tts-chatterbox"
version = "0.1.0"
description = "Chatterbox-Turbo TTS inference package (isolated venv)"
requires-python = ">=3.11"
dependencies = [
    "tts-inference",
    "chatterbox-tts>=0.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "click>=8.1.0",
]

[tool.uv.sources]
tts-inference = { path = "../../tts-inference", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_chatterbox"]
