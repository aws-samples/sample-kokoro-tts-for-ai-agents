[project]
name = "tts-orpheus"
version = "0.1.0"
description = "Orpheus TTS inference package (isolated venv)"
requires-python = ">=3.11"
dependencies = [
    "tts-inference",
    "orpheus-speech",
    "torch>=2.0.0",
    "vllm==0.7.3",
    "transformers>=4.46.0,<5.0.0",
    "soundfile>=0.12.0",
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "click>=8.1.0",
]

[tool.uv.sources]
tts-inference = { path = "../../tts-inference", editable = true }
orpheus-speech = { git = "https://github.com/canopyai/Orpheus-TTS", subdirectory = "orpheus_tts_pypi" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_orpheus"]
