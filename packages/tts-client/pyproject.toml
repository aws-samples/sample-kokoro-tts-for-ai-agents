[project]
name = "tts-client"
version = "0.1.0"
description = "Blocking client for the TTS synthesis API — response-stream and bidirectional transports"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    # <0.8.0: 0.8.0 dropped the synchronous SageMakerRuntimeHTTP2Client class
    # _bidi_transport.py imports, in favor of an async-only client. Confirmed by
    # installing 0.8.0/0.9.0/0.10.0 directly and inspecting the module.
    "aws-sdk-sagemaker-runtime-http2>=0.7.0,<0.8.0",
]

[project.optional-dependencies]
polly = ["librosa>=0.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_client"]
