[project]
name = "tts-client"
version = "0.1.0"
description = "Blocking client for the TTS synthesis API — response-stream and bidirectional transports"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    "aws-sdk-sagemaker-runtime-http2>=0.7.0",
]

[project.optional-dependencies]
polly = ["librosa>=0.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_client"]
