[project]
name = "tts-eval"
version = "0.1.0"
description = "Quality evaluation for TTS models — UTMOS, WER, human panel"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "tts-inference",
    "tts-client[polly]",
    "shared",
    "loguru>=0.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "jiwer>=3.0.0",
    "speechmos>=0.0.1",
    "onnxruntime>=1.17.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "boto3>=1.34.0",
    "aws-sdk-sagemaker-runtime-http2>=0.7.0",
]

[project.scripts]
tts-eval = "tts_eval.cli:main"

[tool.uv.sources]
tts-inference = { workspace = true }
tts-client = { workspace = true }
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_eval"]
