[project]
name = "stt-bench"
version = "0.1.0"
description = "Performance benchmarking for STT models — throughput, latency, RTF"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "stt-inference",
    "loguru>=0.7.0",
]

[tool.uv.sources]
stt-inference = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_bench"]
