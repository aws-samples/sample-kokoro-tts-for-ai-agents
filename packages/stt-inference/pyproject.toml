[project]
name = "stt-inference"
version = "0.1.0"
description = "STT inference package — local GPU and SageMaker backends"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
    "soundfile>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_inference"]
