[project]
name = "shared"
version = "0.1.0"
description = "Shared types and data loaders for the STT-TTS-Model-Eval workspace"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
