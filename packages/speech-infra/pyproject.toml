[project]
name = "speech-infra"
version = "0.1.0"
description = "AWS CDK infrastructure for STT and TTS SageMaker endpoints"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "aws-cdk-lib>=2.100.0",
    "constructs>=10.0.0",
    "loguru>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_infra"]
