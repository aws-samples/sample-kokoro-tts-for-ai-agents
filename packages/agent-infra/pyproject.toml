[project]
name = "agent-infra"
version = "0.1.0"
description = "AWS CDK infrastructure for the Strands/AgentCore voice-agent demo"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "aws-cdk-lib>=2.100.0",
    "constructs>=10.0.0",
    "click>=8.1.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
]

[project.scripts]
agent-infra = "agent_infra.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_infra"]
